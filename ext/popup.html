<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>ZDM</title>
  <style>
    :root { color-scheme: dark; }
    body {
      margin: 0;
      width: 280px;
      background: #17171f;
      color: #f2f2f2;
      font: 13px/1.4 -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }
    main { padding: 14px 14px 12px; }
    .header-row {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 12px;
    }
    .popup-logo {
      width: 32px;
      height: 32px;
      position: relative;
      cursor: pointer;
      display: block;
      border-radius: 8px;
      flex-shrink: 0;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.4);
      transition: transform 0.25s cubic-bezier(0.16, 1, 0.3, 1), box-shadow 0.25s ease, border-radius 0.25s ease;
      transform: translateZ(0);
      user-select: none;
      -webkit-user-select: none;
      outline: none;
    }
    .popup-logo.is-circle {
      border-radius: 50%;
    }
    .popup-logo.is-square {
      border-radius: 8px;
    }
    .popup-logo:hover {
      transform: scale(1.08) translateZ(0);
      box-shadow: 0 4px 14px rgba(0, 180, 216, 0.35);
    }
    .popup-logo:active {
      transform: scale(0.94) translateZ(0);
    }
    .popup-logo-frame {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block;
      pointer-events: none;
      transform: translateZ(0);
    }
    .popup-logo-arrow {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block;
      pointer-events: none;
      transform-origin: 50% 50%;
      transform: rotate(0deg) translateZ(0);
      transition: transform 0.44s cubic-bezier(0.16, 1, 0.3, 1);
      will-change: transform;
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
    }
    .popup-logo:hover .popup-logo-arrow {
      transform: rotate(90deg) translateY(0.5px) translateZ(0);
      transition: transform 0.48s cubic-bezier(0.34, 1.3, 0.64, 1);
    }
    .header-text {
      flex: 1;
    }
    h1 { margin: 0; font-size: 14px; font-weight: 650; }
    .status { margin: 1px 0 0; font-size: 12px; color: #8fd18f; }
    .status.off { color: #e07a7a; }
    label {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin: 0 0 10px;
    }
    button {
      width: 100%;
      margin-top: 4px;
      height: 28px;
      border: 1px solid rgba(255,255,255,0.14);
      border-radius: 6px;
      background: #242433;
      color: inherit;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <main>
    <div class="header-row">
      <div class="popup-logo is-square" id="popup-logo" title="Switch style (Square / Circle)" role="button" tabindex="0">
        <img class="popup-logo-frame" id="popup-logo-frame" src="icons/icon-square-frame.png" alt="" draggable="false">
        <img class="popup-logo-arrow" id="popup-logo-arrow" src="icons/icon-square-arrow.png" alt="" draggable="false">
      </div>
      <div class="header-text">
        <h1>ZDM</h1>
        <p class="status" id="status">Checking the app…</p>
      </div>
    </div>
    <label>Catch downloads from the browser <input type="checkbox" id="capture"></label>
    <label>Find media on the page <input type="checkbox" id="find-media"></label>
    <label>Add downloads silently <input type="checkbox" id="silent"></label>
    <label>Right-click Send to ZDM <input type="checkbox" id="context-menu"></label>
    <button type="button" id="more">More settings</button>
  </main>
  <script src="popup.js"></script>
</body>
</html>
